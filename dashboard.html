<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sirius Doc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="dashboard-body" style="background-color: #f8fafc; display: none;">

    <nav class="navbar" style="background: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid #e2e8f0;">
        <div class="logo" style="font-weight: 700; font-size: 20px;">✨ Sirius Doc</div>
        
        <div class="user-menu" style="display: flex; align-items: center; gap: 20px;">
            <span id="user-email" style="font-size: 14px; color: #64748b; font-weight: 500;">Memuat user...</span>
            <button class="btn btn-primary">+ Dokumen Baru</button>
            <button id="logout-btn" class="btn" style="background: #ef4444; color: white; border: none; cursor: pointer;">Keluar</button>
        </div>
    </nav>

    <main style="padding: 40px 50px; max-width: 1000px; margin: 0 auto;">
        <h2 style="margin-bottom: 30px; font-weight: 700; color: #1e293b;">Dokumen Saya</h2>
        
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);">
            <p style="color: #64748b; text-align: center; padding: 40px;">Belum ada dokumen. Ayo mulai buat yang pertama!</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
