<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sirius Doc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f8fafc;">

    <!-- Navbar Khusus Dashboard -->
    <nav class="navbar" style="background: white;">
        <div class="logo">✨ Sirius Doc</div>
        <div class="user-menu">
            <button class="btn btn-primary">+ Dokumen Baru</button>
        </div>
    </nav>

    <!-- Area Dashboard -->
    <main style="padding: 40px 50px; max-width: 1000px; margin: 0 auto;">
        <h2 style="margin-bottom: 30px;">Dokumen Saya</h2>
        
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
            <p style="color: #64748b; text-align: center; padding: 40px;">Belum ada dokumen. Ayo mulai buat yang pertama!</p>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="js/supabase.js"></script>
    
    <script src="js/dashboard.js"></script>
</body>
</html>
