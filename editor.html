<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Sirius Doc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>

    <nav class="editor-navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button onclick="window.location.href='dashboard.html'" class="btn" style="background: transparent; border: 1px solid #cbd5e1; cursor: pointer;">⬅️ Kembali</button>
            <div class="document-title">
                <input id="title-input" type="text" value="Dokumen Tanpa Judul" style="font-size: 18px; font-weight: 600; border: none; outline: none; background: transparent; width: 300px;">
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="collaborators-container" style="display: flex; gap: -10px; margin-right: 15px;"></div>

            <button id="export-word-btn" class="btn" style="background: #2563eb; color: white; border: none; cursor: pointer;">📄 Word</button>
            <button id="export-pdf-btn" class="btn" style="background: #10b981; color: white; border: none; cursor: pointer;">⬇️ PDF</button>
            <button id="share-btn" class="btn" style="background: #6366f1; color: white; border: none; cursor: pointer;">🤝 Bagikan</button>
            <button id="save-btn" class="btn btn-primary" style="border: none;">Simpan</button>
        </div>
    </nav>

    <div class="editor-layout">
        
        <aside class="sidebar">
            
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            
            <button id="image-btn" class="sidebar-btn">
                <span class="icon">🖼️</span> Gambar
            </button>
            
            <button class="sidebar-btn" onclick="insertTable(3, 3)">
                <span class="icon">📊</span> Tabel
            </button>
            
            <button class="sidebar-btn" onclick="insertDivider()">
                <span class="icon">➖</span> Garis
            </button>
            
        </aside>

        <main class="workspace">
            <div id="editor-canvas" class="paper" contenteditable="true"></div>
        </main>
    </div>

    <div id="floating-toolbar" class="floating-toolbar" style="display: none;">
        <select onchange="formatText('fontName', this.value)">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times</option>
            <option value="Courier New">Courier</option>
        </select>
        
        <select onchange="formatText('formatBlock', this.value)">
            <option value="P">Teks Normal</option>
            <option value="H1">Judul 1</option>
            <option value="H2">Judul 2</option>
        </select>

        <div class="toolbar-divider"></div>
        <button onclick="formatText('bold')" style="font-weight: bold;">B</button>
        <button onclick="formatText('italic')" style="font-style: italic;">I</button>
        <button onclick="formatText('underline')" style="text-decoration: underline;">U</button>
        
        <div class="toolbar-divider"></div>
        <input type="color" onchange="formatText('foreColor', this.value)" value="#ffffff" title="Warna Teks">
        <input type="color" onchange="formatText('hiliteColor', this.value)" value="#1e293b" title="Warna Latar">

        <div class="toolbar-divider"></div>
        <button onclick="formatText('justifyLeft')">⬅️</button>
        <button onclick="formatText('justifyCenter')">↔️</button>
        <button onclick="formatText('justifyRight')">➡️</button>
        <button onclick="formatText('insertUnorderedList')">•</button>
    </div>

    <div id="share-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 380px;">
            <h3 style="margin-top:0; margin-bottom: 20px;">Bagikan Dokumen</h3>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; color: #64748b; display: block; margin-bottom: 8px;">Undang Teman</label>
                <div style="display: flex; gap: 8px;">
                    <input type="email" id="share-email" placeholder="contoh@email.com" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
                    <button id="confirm-share-btn" class="btn" style="background: #6366f1; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 6px;">Undang</button>
                </div>
            </div>
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;">
            <div style="margin-bottom: 25px;">
                <label style="font-size: 13px; font-weight: 600; color: #64748b; display: block; margin-bottom: 8px;">Akses Link Bersama</label>
                <select id="link-mode-select" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
                    <option value="private">🔒 Pribadi (Hanya yang diundang)</option>
                    <option value="view">👁️ Siapa saja yang punya link bisa Lihat</option>
                    <option value="edit">✏️ Siapa saja yang punya link bisa Edit</option>
                </select>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <button id="copy-link-modal-btn" style="flex: 1; padding: 10px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: 600;">🔗 Salin Link</button>
                <button onclick="document.getElementById('share-modal').style.display='none'" style="padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Selesai</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
