<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Sirius Doc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>

    <nav class="editor-navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button onclick="window.location.href='dashboard.html'" class="btn" style="background: transparent; border: 1px solid #cbd5e1; cursor: pointer;">⬅️ Kembali</button>
            
            <div class="document-title" style="display: flex; align-items: center; gap: 15px;">
                <input id="title-input" type="text" value="Dokumen Tanpa Judul" style="font-size: 18px; font-weight: 600; border: none; outline: none; background: transparent; width: 200px;">
                
                <div style="display: flex; align-items: center; gap: 6px; background: #f1f5f9; padding: 4px 10px; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <span style="font-size: 12px; color: #64748b; font-weight: 600;">📄 Kertas:</span>
                    <select id="paper-size-select" style="padding: 2px 6px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; font-size: 12px; font-weight: 500; cursor: pointer;">
                        <option value="a4">A4 (210x297)</option>
                        <option value="legal">Legal (216x356)</option>
                        <option value="f4">F4 (215x330)</option>
                        <option value="custom">⚙️ Custom</option>
                    </select>
                    
                    <div id="custom-paper-inputs" style="display: none; align-items: center; gap: 4px; margin-left: 5px;">
                        <input type="number" id="custom-width" value="210" style="width: 45px; padding: 2px; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px;">x</span>
                        <input type="number" id="custom-height" value="297" style="width: 45px; padding: 2px; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px;">mm</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 15px; align-items: center;">
            <div id="collaborators-container" style="display: flex; gap: -10px;"></div>

            <button id="menu-dropdown-btn" class="btn" style="background: white; border: 1px solid #cbd5e1; font-size: 16px; padding: 6px 12px; border-radius: 6px; cursor: pointer;">⚙️ Menu ⋮</button>
            
            <div id="action-menu" class="action-menu">
                <button id="save-btn">💾 Simpan</button>
                <button id="share-btn">🤝 Bagikan</button>
                <hr style="margin: 0; border-top: 1px solid #e2e8f0;">
                <button id="export-pdf-btn">⬇️ Unduh PDF</button>
                <button id="export-word-btn">📄 Unduh Word</button>
            </div>
        </div>
    </nav>

    <div class="editor-layout">
        <aside class="sidebar">
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            <button id="image-btn" class="sidebar-btn"><span class="icon">🖼️</span> Gambar</button>
            <button class="sidebar-btn" onclick="insertTable(3, 3)"><span class="icon">📊</span> Tabel</button>
            <button class="sidebar-btn" onclick="insertDivider()"><span class="icon">➖</span> Garis</button>
        </aside>

        <main class="workspace">
            <div id="editor-canvas" class="paper" contenteditable="true"></div>
        </main>
    </div>

    <div id="floating-toolbar" class="floating-pill-menu" style="display: none;">
        <button onclick="formatText('formatBlock', 'H1')" title="Judul Besar">H1</button>
        <button onclick="formatText('formatBlock', 'H2')" title="Judul Sedang">H2</button>
        <button onclick="formatText('formatBlock', 'P')" title="Teks Normal">P</button>
        
        <div class="pill-divider"></div>
        <button onclick="formatText('bold')" style="font-weight: bold;">B</button>
        <button onclick="formatText('italic')" style="font-style: italic;">I</button>
        <button onclick="formatText('underline')" style="text-decoration: underline;">U</button>
        
        <div class="pill-divider"></div>
        <input type="color" onchange="formatText('foreColor', this.value)" value="#ffffff" title="Warna Teks" class="color-picker-pill">
        
        <div class="pill-divider"></div>
        <button onclick="formatText('justifyLeft')" title="Rata Kiri">⬅️</button>
        <button onclick="formatText('justifyCenter')" title="Rata Tengah">↔️</button>
        <button onclick="formatText('insertUnorderedList')" title="Bullet List">• List</button>
    </div>

    <div id="share-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <h3 style="margin-top:0; margin-bottom: 20px; color: #1e293b;">Bagikan Dokumen</h3>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; color: #64748b; display: block; margin-bottom: 8px;">Undang Teman (Akses Edit)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="email" id="share-email" placeholder="contoh@email.com" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
                    <button id="confirm-share-btn" class="btn" style="background: #6366f1; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 6px; font-weight: 600;">Undang</button>
                </div>
            </div>
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;">
            <div style="margin-bottom: 25px;">
                <label style="font-size: 13px; font-weight: 600; color: #64748b; display: block; margin-bottom: 8px;">Akses Link Bersama</label>
                <select id="link-mode-select" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; cursor: pointer; font-size: 14px; font-weight: 500; color: #1e293b; background: #f8fafc;">
                    <option value="private">🔒 Pribadi</option>
                    <option value="view">👁️ Bisa Lihat</option>
                    <option value="edit">✏️ Bisa Edit</option>
                </select>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <button id="copy-link-modal-btn" style="flex: 1; padding: 10px; background: white; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569;">🔗 Salin Link</button>
                <button onclick="document.getElementById('share-modal').style.display='none'" style="padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569;">Selesai</button>
            </div>
        </div>
    </div>

    <div id="table-toolbar" class="floating-pill-menu" style="display: none; background: #4f46e5;">
        <button onclick="addTableRow()" title="Tambah Baris">⬇️ +Baris</button>
        <button onclick="addTableCol()" title="Tambah Kolom">➡️ +Kolom</button>
        <div class="pill-divider" style="background: #818cf8;"></div>
        <button onclick="deleteTableRow()" title="Hapus Baris" style="color: #fca5a5;">🗑️ Baris</button>
        <button onclick="deleteTableCol()" title="Hapus Kolom" style="color: #fca5a5;">🗑️ Kolom</button>
        <button onclick="deleteTableFull()" title="Hapus Tabel" style="color: #ef4444;">❌ Tabel</button>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/editor.js"></script>

</body>
</html>
